[build]
  # The command to build the project from the root
  command = "cd steak_frontend && pnpm build"
  
  # The directory where the build output is located (relative to root)
  publish = "steak_frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  # This redirect rule ensures that all paths are handled by the single-page app (React Router)
  from = "/*"
  to = "/index.html"
  status = 200
